; AutoBotAI Explorer Bot firmware — PlatformIO project.
; Build:   pio run -e esp32dev
; Upload:  pio run -e esp32dev -t upload
; Monitor: pio device monitor -b 115200
; Host tests of the safety core (no board needed): npm run test:firmware (from the repository root)
;
; Not built in the AutoBotAI CI environment: the ESP32 toolchain could not be installed there.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  pololu/VL53L0X@^1.3.1
build_flags = -Wall
